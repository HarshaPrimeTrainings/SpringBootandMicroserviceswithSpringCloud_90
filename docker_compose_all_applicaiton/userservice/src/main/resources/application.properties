spring.application.name=userservice

spring.datasource.url=jdbc:mysql://192.168.29.244:3306/spring_boot_microservices_90
spring.datasource.username=root
spring.datasource.password=admin

# Automatically loaded by SpringData based on JDBC url
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQlDialect
spring.jpa.hibernate.ddl-auto=update

spring.jackson.mapper.sort-properties-alphabetically=false

spring.jpa.show-sql=true

orderservice.url=http://ORDERSERVICE/order

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://service3:8761/eureka
eureka.client.registry-fetch-interval-seconds=10
eureka.client.instance-info-replication-interval-seconds=10

management.endpoints.web.exposure.include=*

logging.level.org.springframework.web=trace
logging.pattern.level=%5p[${spring.application.name},%X{traceId},%X{spanId}]

management.tracing.sampling.probability=1

management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans


resilience4j.circuitbreaker.instances.greetcircuit.register-health-indicator=true

# Configure settings for perticilar CircuitBreaker i.e greetcicuit
resilience4j.circuitbreaker.instances.greetcircuit.sliding-window-size=5
resilience4j.circuitbreaker.instances.greetcircuit.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.greetcircuit.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.greetcircuit.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.greetcircuit.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.greetcircuit.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.greetcircuit.event-consumer-buffer-size=10



resilience4j.circuitbreaker.instances.orderretry.sliding-window-size=3
resilience4j.circuitbreaker.instances.orderretry.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.orderretry.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.orderretry.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.orderretry.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.orderretry.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.orderretry.event-consumer-buffer-size=10


# Retry Configuration
resilience4j.retry.instances.orderretry.max-attempts=3
resilience4j.retry.instances.orderretry.wait-duration=5s

# Default Retry Configuration
#resilience4j.retry.instances.default.max-attempts=3
# resilience4j.retry.instances.default.wait-duration=5s

